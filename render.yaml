services:
  - type: web
    name: nexus-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: ENGINE_URL
        value: http://nexus-engine:4100
      - key: ENGINE_INTERNAL_SECRET
        generateValue: true
      - key: ENGINE_CALLBACK_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  - type: redis
    name: nexus-redis
    plan: free
    ipAllowList: []

  - type: pserv
    name: nexus-engine
    runtime: docker
    dockerfilePath: ./apps/engine/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4100
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: ENGINE_INTERNAL_SECRET
        fromService:
          type: web
          name: nexus-api
          envVarKey: ENGINE_INTERNAL_SECRET

  - type: pserv
    name: nexus-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXUS_API_URL
        fromService:
          type: web
          name: nexus-api
          property: hostport

databases:
  - name: nexus-postgres
    plan: free
