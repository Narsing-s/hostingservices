services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_password
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: ["nexus-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  engine:
    build: ./apps/engine
    environment:
      PORT: 4100
    ports: ["4100:4100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [postgres, redis]
volumes:
  nexus-postgres:
