services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_only
    ports:
      - '5432:5432'
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - nexus-redis:/data
volumes:
  nexus-postgres:
  nexus-redis:
