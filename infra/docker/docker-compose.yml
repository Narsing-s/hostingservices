services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_dev_only
    ports:
      - '5432:5432'
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    networks: [nexus-runtime]

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - nexus-redis:/data
    networks: [nexus-runtime]

  traefik:
    image: traefik:v3.5
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    networks: [nexus-runtime]

networks:
  nexus-runtime:
    name: nexus-runtime
    driver: bridge

volumes:
  nexus-postgres:
  nexus-redis:
