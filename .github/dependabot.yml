version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/apps/web"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/apps/engine"
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: "/apps/agent"
    schedule:
      interval: monthly
