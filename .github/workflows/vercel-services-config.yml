name: Vercel Services Config

on:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'scripts/validate-vercel-services.mjs'
      - 'apps/web/**'
      - 'apps/api/**'
  pull_request:
    paths:
      - 'vercel.json'
      - 'scripts/validate-vercel-services.mjs'
      - 'apps/web/**'
      - 'apps/api/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Vercel Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate configuration
        run: node scripts/validate-vercel-services.mjs
      - name: Validate JSON syntax
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json JSON syntax OK')"
