name: Local Compose Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-compose-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate complete Compose stack
        run: docker compose config

      - name: Build complete platform
        run: docker compose build --no-cache api web engine agent

      - name: Start complete platform
        run: docker compose up -d

      - name: Wait for platform health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            api=$(curl -fsS http://127.0.0.1:4000/health 2>/dev/null || true)
            engine=$(curl -fsS http://127.0.0.1:4100/health 2>/dev/null || true)
            agent=$(curl -fsS http://127.0.0.1:4200/health 2>/dev/null || true)
            web=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ 2>/dev/null || true)
            if [ -n "$api" ] && [ -n "$engine" ] && [ -n "$agent" ] && [ "$web" = "200" ]; then
              echo "API: $api"
              echo "Engine: $engine"
              echo "Agent: $agent"
              echo "Web HTTP: $web"
              exit 0
            fi
            echo "Waiting for Nexus services ($i/60)..."
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 api engine agent web
          exit 1

      - name: Verify API readiness sees engine
        run: |
          curl --fail --show-error --silent http://127.0.0.1:4000/api/v1/readiness

      - name: Verify auth provider discovery is safe
        run: |
          curl --fail --show-error --silent http://127.0.0.1:4000/api/auth/providers | tee /tmp/providers.json
          ! grep -E 'CLIENT_(ID|SECRET)|SECRET|TOKEN' /tmp/providers.json

      - name: Verify real runtime deployment path
        shell: bash
        run: |
          set -euo pipefail
          SECRET=$(node -e "const c=require('crypto'); console.log(c.createHmac('sha256','local-engine-internal-secret').update('nexus-engine').digest('hex'))")
          export DEPLOYMENT_ID="smoke-${GITHUB_RUN_ID}"
          PAYLOAD=$(node -e 'console.log(JSON.stringify({name:"nexus-smoke",image:"node:20-bookworm-slim",deploymentId:process.env.DEPLOYMENT_ID,containerPort:3000,public:false,healthMode:"process",command:["node","-e","setInterval(()=>{}, 1000)"]}))')
          response=$(curl --fail --show-error --silent \
            -X POST http://127.0.0.1:4100/api/v1/runtime/deploy \
            -H "content-type: application/json" \
            -H "x-engine-secret: $SECRET" \
            -H "Idempotency-Key: smoke-${GITHUB_RUN_ID}" \
            -d "$PAYLOAD")
          echo "$response"
          echo "$response" | grep -q '"accepted":true'
          for i in {1..30}; do
            containers=$(curl --fail --show-error --silent \
              -H "x-engine-secret: $SECRET" \
              http://127.0.0.1:4100/api/v1/runtime/containers)
            if echo "$containers" | grep -q 'nexus-smoke'; then
              echo "$containers"
              docker rm -f nexus-smoke 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=300 engine
          docker rm -f nexus-smoke 2>/dev/null || true
          exit 1

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=300 api engine agent web postgres redis

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
