name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --version
      - run: npm install --legacy-peer-deps --force --no-audit --no-fund
      - run: npm run build
      - name: Validate Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config
