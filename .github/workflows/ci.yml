name: CI

on:
  push:
    branches: [main, feat/production-hosting-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --version
      - run: npm install --legacy-peer-deps --force --no-audit --no-fund
      - run: npm run build
      - name: Validate complete Docker Compose
        run: docker compose config
      - name: Validate infrastructure Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config
