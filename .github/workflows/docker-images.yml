name: Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nexus-api
            dockerfile: apps/api/Dockerfile
            target: api
          - name: nexus-web
            dockerfile: apps/web/Dockerfile
            target: runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: nexus/${{ matrix.name }}:ci
          build-args: |
            NEXT_PUBLIC_NEXUS_API_URL=http://localhost:4000
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
